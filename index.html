<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101923"><title>Rangers FC Tactical Studio</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#edf4fa;background:#0b121a}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:11px 14px;background:#223347;color:#f3f7fc}button:hover{background:#2c4560}.primary{background:#c6f36a;color:#12210c;font-weight:750}.danger{background:#583039}header{padding:18px 20px;background:#101b27;border-bottom:1px solid #263445;display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:19px;margin:0}h2{margin:0 0 13px;font-size:21px}h3{font-size:15px;margin:0 0 9px}small,.muted{color:#a2b2c4}.brand{font-size:11px;letter-spacing:.15em;color:#c6f36a;font-weight:800}nav{display:flex;gap:6px;overflow-x:auto;padding:12px;background:#101b27;border-bottom:1px solid #263445}nav button{white-space:nowrap;background:transparent;color:#a7b9ca}nav button.active{background:#c6f36a;color:#15220e}main{max-width:1150px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}.panel{background:#15212d;border:1px solid #2b3a4b;border-radius:16px;padding:17px;margin-bottom:16px}.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.spread{display:flex;justify-content:space-between;gap:10px;align-items:center}.field{display:grid;gap:6px;margin-bottom:10px}input,select,textarea{width:100%;border:1px solid #3a4c5d;border-radius:10px;background:#0e1822;color:#fff;padding:11px}textarea{min-height:90px;resize:vertical}.row{padding:10px 0;border-bottom:1px solid #2c3c4a}.row:last-child{border:0}.tag{display:inline-block;border-radius:7px;background:#263c47;padding:4px 8px;color:#c6f36a;font-size:12px}.pitch{position:relative;aspect-ratio:0.7;max-width:510px;margin:auto;border:3px solid #b9dcbf;border-radius:9px;background:repeating-linear-gradient(0deg,#235e48 0 12.5%,#1d533f 12.5% 25%);touch-action:none;overflow:hidden}.pitch:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid #a5d7bd}.center{position:absolute;top:50%;left:50%;width:26%;aspect-ratio:1;border:2px solid #b6dfc5;border-radius:50%;transform:translate(-50%,-50%)}.area{position:absolute;left:22%;width:56%;height:17%;border:2px solid #b6dfc5}.area.top{top:0;border-top:0}.area.bottom{bottom:0;border-bottom:0}.player{position:absolute;width:39px;height:39px;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%);background:#d7f67d;color:#1d2b12;border:2px solid #101d18;border-radius:50%;font-size:12px;font-weight:850;box-shadow:0 2px 8px #0008;touch-action:none;user-select:none;z-index:3}.player.enemy{background:#e98c85;color:#2a1313}.ball{background:#fff;color:#000;font-size:21px}.player.selected{outline:3px solid #fff}.pitch svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.metric{font-size:25px;font-weight:800;color:#c6f36a}.notice{border-left:3px solid #c6f36a;padding:9px 13px;background:#1c2d30;border-radius:6px}.hidden{display:none!important}@media(max-width:760px){.grid{grid-template-columns:1fr}header{padding:14px}main{padding:12px}.panel{padding:13px}.pitch{max-width:450px}.player{width:36px;height:36px}nav{position:sticky;top:0;z-index:10}}@media(min-width:760px){nav{justify-content:center}}
</style></head><body><header><div><div class="brand">RANGERS FC · FÚTBOL 7</div><h1>Tactical Studio <span class="tag">Independiente</span></h1></div><button onclick="exportData()">Exportar copia</button></header><nav id="nav"></nav><main id="app"></main><input type="file" id="import" accept="application/json" hidden onchange="importData(event)"><script>
const KEY='rangers-studio-v1';const roster=[['Santi','POR'],['Andrés','DEF/DEL'],['Samu','DEF'],['Pérez','DEF/LAT'],['Danny','DEF/LAT'],['John','DEF/LAT'],['Stephen','DEF/MCD'],['Jhoel','DEF/DEL'],['Andrew','MED/DEL'],['Xavi','MED'],['Kevin','MED/DEL/EXT'],['Diego','MED'],['Jorge','DEL/EXT'],['David','MED/EXT/DEL']];const defaults=()=>({players:roster.map((p,i)=>({id:i+1,name:p[0],pos:p[1]})),lineup:[1,3,4,10,11,13,14],board:{},plays:[],sessions:[],matches:[],sets:[],notes:[],defense:[],voice:false});let data;try{data={...defaults(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{data=defaults()}let tab='Inicio',selected=null,drawMode=false,drawStart=null;const tabs=['Inicio','Pizarra','Defensa','Entrenamientos','Partidos','Alineación','Balón parado','Ted Lasso','Jugadores'];const el=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('No se pudieron guardar los datos. Exporta una copia.')}}function setTab(t){tab=t;selected=null;drawMode=false;render()}function render(){el('nav').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" onclick="setTab('${t}')">${t}</button>`).join('');const views={'Inicio':home,'Pizarra':boardPage,'Defensa':defensePage,'Entrenamientos':trainingPage,'Partidos':matchesPage,'Alineación':lineupPage,'Balón parado':setPiecesPage,'Ted Lasso':coachPage,'Jugadores':playersPage};el('app').innerHTML=views[tab]();if(tab==='Pizarra'||tab==='Defensa'||tab==='Balón parado')initPitch()}
function home(){return `<h2>Centro de mando</h2><div class="grid"><div><div class="panel"><h3>Próximo paso</h3><p>Diseña una jugada en la pizarra, guárdala y prepara una sesión de entrenamiento para practicarla.</p><button class="primary" onclick="setTab('Pizarra')">Abrir pizarra táctica</button></div><div class="panel"><h3>Datos y seguridad</h3><p class="muted">Los datos se guardan en este navegador. No se sincronizan entre dispositivos. Exporta copias periódicamente.</p><div class="flex"><button onclick="exportData()">Exportar JSON</button><button onclick="el('import').click()">Importar JSON</button></div></div></div><div><div class="panel"><div class="metric">${data.players.length}</div><small>Jugadores</small></div><div class="panel"><div class="metric">${data.plays.length+data.sets.length}</div><small>Jugadas guardadas</small></div><div class="panel"><div class="metric">${data.sessions.length}</div><small>Entrenamientos planificados</small></div></div></div>`}
const standardPositions=[[50,91],[28,71],[72,71],[50,60],[24,42],[76,42],[50,24]];function currentBoard(kind){if(!data.board[kind])data.board[kind]={positions:Object.fromEntries(data.lineup.map((id,i)=>[id,standardPositions[i]||[50,50]])),arrows:[]};return data.board[kind]}
function pitchHtml(kind){const b=currentBoard(kind);const markers=data.lineup.map(id=>{const p=data.players.find(x=>x.id===id);if(!p)return '';const xy=b.positions[id]||[50,50];return `<div class="player" data-id="${id}" style="left:${xy[0]}%;top:${xy[1]}%" title="${esc(p.name)}">${esc(p.name.slice(0,2).toUpperCase())}</div>`}).join('');const arrows=b.arrows.map(a=>`<line x1="${a[0]}%" y1="${a[1]}%" x2="${a[2]}%" y2="${a[3]}%" stroke="#ffef8d" stroke-width="1.2" marker-end="url(#arrow)"/>`).join('');return `<div class="pitch" id="pitch"><div class="area top"></div><div class="area bottom"></div><div class="center"></div><svg viewBox="0 0 100 100" preserveAspectRatio="none"><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0 L5 2.5 L0 5" fill="none" stroke="#ffef8d" stroke-width="1"/></marker></defs>${arrows}</svg>${markers}<div class="player ball" data-id="ball" style="left:${b.positions.ball?.[0]??50}%;top:${b.positions.ball?.[1]??50}%">⚽</div></div>`}
function boardPage(){return `<h2>Pizarra táctica</h2><div class="grid"><div class="panel">${pitchHtml('attack')}</div><div><div class="panel"><h3>Diseña una jugada</h3><p class="muted">Arrastra jugadores y balón. Activa «Flecha» y toca origen y destino en el campo.</p><div class="flex"><button id="draw" onclick="toggleDraw()">Flecha: desactivada</button><button onclick="clearArrows('attack')">Borrar flechas</button><button onclick="resetBoard('attack')">Restablecer</button></div><div class="field" style="margin-top:15px"><label>Nombre de la jugada</label><input id="playname" placeholder="Salida con centrales abiertos"></div><button class="primary" onclick="storePlay('attack')">Guardar jugada</button></div><div class="panel"><h3>Jugadas guardadas (${data.plays.length})</h3>${data.plays.map((p,i)=>`<div class="row spread"><span>${esc(p.name)}</span><div class="flex"><button onclick="loadPlay(${i})">Cargar</button><button class="danger" onclick="removeItem('plays',${i})">×</button></div></div>`).join('')||'<p class="muted">Sin jugadas guardadas</p>'}</div></div></div>`}
function defensePage(){return `<h2>Simulador defensivo</h2><div class="grid"><div class="panel">${pitchHtml('defense')}</div><div><div class="panel"><h3>Presión y coberturas</h3><p>Coloca a Kevin, Jorge y David en primera línea, Xavi detrás y Samu y Pérez protegiendo la espalda.</p><div class="flex"><button class="primary" onclick="applyDefense()">Aplicar presión alta</button><button onclick="toggleDraw()" id="draw">Flecha: desactivada</button><button onclick="clearArrows('defense')">Borrar flechas</button></div></div><div class="panel"><h3>Escenario defensivo</h3><input id="defname" placeholder="Ej. Rival sale por banda izquierda"><textarea id="defnotes" placeholder="Activadores, coberturas, riesgos y solución"></textarea><button class="primary" onclick="saveDefense()">Guardar escenario</button>${data.defense.map((x,i)=>`<div class="row"><b>${esc(x.name)}</b><p>${esc(x.notes)}</p><button onclick="loadDefense(${i})">Cargar</button> <button onclick="removeItem('defense',${i})">Eliminar</button></div>`).join('')}</div></div></div>`}
function trainingPage(){return `<h2>Planificador de entrenamientos</h2><div class="grid"><div class="panel"><h3>Nueva sesión</h3><label class="field">Fecha<input type="date" id="trainDate"></label><label class="field">Objetivo<input id="trainTitle" placeholder="Salida bajo presión"></label><label class="field">Duración (minutos)<input id="trainMinutes" type="number" value="60" min="1"></label><label class="field">Ejercicios<textarea id="trainDrills" placeholder="15 min calentamiento, 20 min salida 3v2..."></textarea></label><button class="primary" onclick="addTraining()">Guardar sesión</button></div><div class="panel"><h3>Sesiones (${data.sessions.length})</h3>${data.sessions.map((s,i)=>`<div class="row"><span class="tag">${esc(s.date)}</span><h3>${esc(s.title)}</h3><small>${esc(s.minutes)} minutos</small><p>${esc(s.drills)}</p><button onclick="removeItem('sessions',${i})">Eliminar</button></div>`).join('')||'<p class="muted">Añade tu primera sesión</p>'}</div></div>`}
function matchesPage(){return `<h2>Análisis de partidos</h2><div class="grid"><div class="panel"><h3>Registrar partido</h3><label class="field">Fecha<input type="date" id="matchDate"></label><label class="field">Rival<input id="opponent" placeholder="Equipo rival"></label><div class="flex"><label class="field">Goles Rangers<input id="goalsFor" type="number" min="0" value="0"></label><label class="field">Goles rival<input id="goalsAgainst" type="number" min="0" value="0"></label></div><label class="field">Análisis y estadísticas<textarea id="matchNotes" placeholder="Posesión, ocasiones, fortalezas, errores, cambios..."></textarea></label><button class="primary" onclick="addMatch()">Guardar partido</button></div><div class="panel"><h3>Historial</h3>${data.matches.map((m,i)=>`<div class="row"><span class="tag">${esc(m.date)}</span><h3>Rangers ${esc(m.gf)} – ${esc(m.ga)} ${esc(m.opponent)}</h3><p>${esc(m.notes)}</p><button onclick="removeItem('matches',${i})">Eliminar</button></div>`).join('')||'<p class="muted">Aún no hay partidos registrados</p>'}</div></div>`}
function lineupPage(){return `<h2>Alineaciones y cambios</h2><div class="grid"><div class="panel"><h3>Titulares (${data.lineup.length}/7)</h3>${data.players.map(p=>`<div class="row spread"><div><b>${esc(p.name)}</b> <small>${esc(p.pos)}</small></div><button class="${data.lineup.includes(p.id)?'primary':''}" onclick="toggleLineup(${p.id})">${data.lineup.includes(p.id)?'Titular ✓':'Suplente'}</button></div>`).join('')}</div><div><div class="panel"><h3>Rotaciones</h3><p class="muted">Marca siete titulares. Los demás quedan como suplentes. Puedes registrar un plan de sustituciones.</p><label class="field">Plan de cambios<textarea id="changeNotes" placeholder="Min 15: Kevin por Diego; min 30...">${esc(data.changes||'')}</textarea></label><button onclick="saveChanges()">Guardar plan</button><div id="changes">${esc(data.changes||'')}</div></div><div class="panel"><h3>Resumen</h3><p><b>En campo:</b> ${data.players.filter(p=>data.lineup.includes(p.id)).map(p=>esc(p.name)).join(', ')}</p><p><b>Banquillo:</b> ${data.players.filter(p=>!data.lineup.includes(p.id)).map(p=>esc(p.name)).join(', ')}</p></div></div></div>`}
function setPiecesPage(){return `<h2>Balón parado</h2><div class="grid"><div class="panel">${pitchHtml('set')}</div><div><div class="panel"><h3>Diseño de jugadas</h3><p class="muted">Mueve jugadores y balón para preparar córners, faltas o saques.</p><label class="field">Tipo<select id="settype"><option>Córner</option><option>Falta</option><option>Saque de banda</option><option>Saque de portería</option></select></label><label class="field">Nombre<input id="setname" placeholder="Córner al segundo palo"></label><div class="flex"><button id="draw" onclick="toggleDraw()">Flecha: desactivada</button><button onclick="clearArrows('set')">Borrar flechas</button></div><button class="primary" onclick="storePlay('set')">Guardar estrategia</button></div><div class="panel"><h3>Jugadas guardadas</h3>${data.sets.map((p,i)=>`<div class="row spread"><span>${esc(p.type)} · ${esc(p.name)}</span><div><button onclick="loadSet(${i})">Cargar</button><button onclick="removeItem('sets',${i})">×</button></div></div>`).join('')||'<p class="muted">Sin jugadas</p>'}</div></div></div>`}
function coachPage(){return `<h2>Ted Lasso · Asistente táctico</h2><div class="panel notice"><b>Modo asesor local</b><p>Este entrenador ofrece recomendaciones basadas en reglas tácticas y en tu plantilla. No es una IA conversacional conectada a un modelo externo. Las recomendaciones pueden aplicarse a la pizarra.</p></div><div class="grid"><div class="panel"><h3>¿Qué quieres trabajar?</h3><div class="flex"><button onclick="advice('presion')">Presión alta</button><button onclick="advice('salida')">Salida de balón</button><button onclick="advice('bloque')">Bloque bajo</button><button onclick="advice('cambios')">Rotaciones</button></div><div id="coachAnswer" style="margin-top:15px"><p class="muted">Elige un tema para recibir un plan práctico.</p></div></div><div class="panel"><h3>Contexto del equipo</h3><p>Jugadores: ${data.players.length}. Titulares: ${data.lineup.length}. Jugadas: ${data.plays.length}.</p><p class="muted">Para habilitar IA real, voz y conversación abierta hará falta una integración adicional y una configuración segura de credenciales.</p></div></div>`}
function playersPage(){return `<h2>Plantilla Rangers FC</h2><div class="grid"><div class="panel"><h3>Jugadores (${data.players.length})</h3>${data.players.map(p=>`<div class="row spread"><div><b>${esc(p.name)}</b><br><small>${esc(p.pos)}</small></div><div><button onclick="editPlayer(${p.id})">Editar</button> <button class="danger" onclick="deletePlayer(${p.id})">×</button></div></div>`).join('')}</div><div class="panel"><h3>Añadir jugador</h3><label class="field">Nombre<input id="newname"></label><label class="field">Posición<input id="newpos" placeholder="DEF/MED/DEL"></label><button class="primary" onclick="addPlayer()">Añadir</button></div></div>`}
function initPitch(){const pitch=el('pitch');if(!pitch)return;let dragging=null;function point(e){const r=pitch.getBoundingClientRect();return [Math.max(3,Math.min(97,100*(e.clientX-r.left)/r.width)),Math.max(3,Math.min(97,100*(e.clientY-r.top)/r.height))]}pitch.addEventListener('pointerdown',e=>{if(drawMode){const p=point(e);if(!drawStart){drawStart=p}else{const kind=tab==='Defensa'?'defense':tab==='Balón parado'?'set':'attack';currentBoard(kind).arrows.push([...drawStart,...p]);drawStart=null;save();render()}return}const target=e.target.closest('.player');if(!target)return;dragging=target;target.classList.add('selected');pitch.setPointerCapture(e.pointerId)});pitch.addEventListener('pointermove',e=>{if(!dragging)return;const p=point(e);dragging.style.left=p[0]+'%';dragging.style.top=p[1]+'%'});pitch.addEventListener('pointerup',e=>{if(!dragging)return;const kind=tab==='Defensa'?'defense':tab==='Balón parado'?'set':'attack';currentBoard(kind).positions[dragging.dataset.id]=point(e);dragging.classList.remove('selected');dragging=null;save()})}
function toggleDraw(){drawMode=!drawMode;drawStart=null;const b=el('draw');if(b)b.textContent='Flecha: '+(drawMode?'activada':'desactivada')}function clearArrows(k){currentBoard(k).arrows=[];save();render()}function resetBoard(k){data.board[k]=null;save();render()}function storePlay(k){const name=el(k==='set'?'setname':'playname').value.trim();if(!name)return alert('Pon un nombre');const obj={name,board:structuredClone(currentBoard(k))};if(k==='set'){obj.type=el('settype').value;data.sets.push(obj)}else data.plays.push(obj);save();render()}function loadPlay(i){data.board.attack=structuredClone(data.plays[i].board);save();render()}function loadSet(i){data.board.set=structuredClone(data.sets[i].board);save();render()}function removeItem(key,i){if(!confirm('¿Eliminar este elemento?'))return;data[key].splice(i,1);save();render()}
function applyDefense(){const needed=['Santi','Samu','Pérez','Xavi','Kevin','Jorge','David'];const ids=needed.map(n=>data.players.find(p=>p.name===n)?.id).filter(Boolean);if(ids.length===7){data.lineup=ids;data.board.defense=null;}const positions={Santi:[50,92],Samu:[32,76],Pérez:[68,76],Xavi:[50,56],Kevin:[25,34],Jorge:[50,23],David:[75,34]};const b=currentBoard('defense');data.lineup.forEach(id=>{const p=data.players.find(x=>x.id===id);if(p&&positions[p.name])b.positions[id]=positions[p.name]});b.arrows=[[25,34,24,19],[50,23,50,10],[75,34,76,19],[50,56,50,43]];save();render()}function saveDefense(){const name=el('defname').value.trim();if(!name)return alert('Escribe un escenario');data.defense.push({name,notes:el('defnotes').value,board:structuredClone(currentBoard('defense'))});save();render()}function loadDefense(i){data.board.defense=structuredClone(data.defense[i].board);save();render()}
function addTraining(){const title=el('trainTitle').value.trim();if(!title)return alert('Indica objetivo');data.sessions.push({date:el('trainDate').value,title,minutes:el('trainMinutes').value,drills:el('trainDrills').value});save();render()}function addMatch(){const opponent=el('opponent').value.trim();if(!opponent)return alert('Indica rival');data.matches.push({date:el('matchDate').value,opponent,gf:el('goalsFor').value,ga:el('goalsAgainst').value,notes:el('matchNotes').value});save();render()}function toggleLineup(id){if(data.lineup.includes(id))data.lineup=data.lineup.filter(x=>x!==id);else if(data.lineup.length<7)data.lineup.push(id);else return alert('Máximo 7 titulares');data.board={};save();render()}function saveChanges(){data.changes=el('changeNotes').value;save();render()}function addPlayer(){const name=el('newname').value.trim();if(!name)return alert('Escribe nombre');data.players.push({id:Math.max(0,...data.players.map(x=>x.id))+1,name,pos:el('newpos').value.trim()||'POR DEFINIR'});save();render()}function editPlayer(id){const p=data.players.find(x=>x.id===id);const n=prompt('Nombre',p.name);if(n===null||!n.trim())return;const pos=prompt('Posición',p.pos);if(pos===null)return;p.name=n.trim();p.pos=pos.trim();save();render()}function deletePlayer(id){if(!confirm('¿Eliminar jugador?'))return;data.players=data.players.filter(p=>p.id!==id);data.lineup=data.lineup.filter(x=>x!==id);data.board={};save();render()}
const adviceText={presion:['Presión alta 3+1','Kevin, Jorge y David saltan sobre centrales y salida lateral. Xavi protege pase interior. Samu y Pérez vigilan profundidad. Si el rival supera primera línea, repliegue inmediato.'],salida:['Salida con centrales abiertos','Santi inicia con Samu y Pérez separados. Xavi ofrece línea interior, Kevin y David dan amplitud y Jorge fija arriba. Si hay presión intensa, buscar tercer hombre o pase directo a Jorge.'],bloque:['Bloque medio-bajo compacto','Mantén distancias cortas entre líneas, protege el centro y fuerza salida por fuera. El jugador más cercano presiona, el segundo cubre y el tercero equilibra.'],cambios:['Rotaciones por intensidad','Planifica cambios por fatiga, mantén al menos un organizador y dos jugadores de cobertura. Registra sustituciones previstas en Alineación.']};function advice(k){const a=adviceText[k];el('coachAnswer').innerHTML=`<h3>${a[0]}</h3><p>${a[1]}</p><button class="primary" onclick="applyAdvice('${k}')">Aplicar a pizarra</button>`}function applyAdvice(k){if(k==='presion'){applyDefense();setTab('Defensa');return}const b=currentBoard('attack');const coords=k==='salida'?[[50,92],[20,75],[80,75],[50,62],[15,43],[85,43],[50,25]]:k==='bloque'?[[50,92],[30,77],[70,77],[50,68],[20,56],[80,56],[50,48]]:standardPositions;data.lineup.forEach((id,i)=>b.positions[id]=coords[i]);save();setTab('Pizarra')}
function exportData(){const blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),data},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rangers-fc-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);const d=parsed.data||parsed;if(!Array.isArray(d.players)||!Array.isArray(d.lineup))throw Error('Formato inválido');if(confirm('¿Sustituir los datos actuales por la copia?')){data={...defaults(),...d};save();render()}}catch(err){alert('No se pudo importar: '+err.message)}};reader.readAsText(file)}render();</script></body></html>
